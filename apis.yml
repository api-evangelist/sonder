aid: sonder
name: Sonder
description: 'Sonder is a hospitality company that designs, leases, and operates a global
  portfolio of boutique, design-forward apartment-style accommodations and hotels for
  short- and extended-stay travelers. Guests book directly through Sonder''s website and
  mobile app, where a tech-enabled experience spans contactless check-in, in-app service
  requests, and 24/7 local support across cities in North America, Europe, and the Middle
  East. In 2024 Sonder entered a long-term licensing agreement with Marriott that lists
  its properties in the Marriott Bonvoy program. The company is publicly traded and was
  backed by venture investors including Greylock. Sonder publishes no public developer
  API; the only machine-facing surface documented here is its responsible security-disclosure
  program and the site''s domain-security posture.'
